<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT education</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Programming college</h1>
    <p>Learn programming at your pace!</p>
  </header>

  <main>
    <section class="interactive-section">
      <article>
        <h2>Self-paced</h2>
        <button id="changeTextBtn">Apply</button>
        <p id="textContent" class="dynamic-text">Learn at your own time.</p>
      </article>

      <article>
        <h2>Online</h2>
        <button id="changeStyleBtn">Apply</button>
        <div id="styleBox" class="dynamic-box">
          <p>Attend lectures online!</p>
        </div>
      </article>

      <article>
        <h2>Enquiries:</h2>
        <button id="toggleElementBtn">Enquire</button>
        <div id="extraElement" class="hidden">
          <p>This is a dynamically added element!</p>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Interactive Web Page</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
